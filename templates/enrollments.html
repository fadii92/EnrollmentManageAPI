
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrolled Students | Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            color: #172554;
            background:
                radial-gradient(circle at 10% 15%, #93c5fd 0, transparent 32%),
                radial-gradient(circle at 90% 20%, #99f6e4 0, transparent 30%),
                radial-gradient(circle at 70% 90%, #c4b5fd 0, transparent 35%),
                linear-gradient(135deg, #e0e7ff, #dbeafe 50%, #ecfeff);
            background-attachment: fixed;
        }

        nav {
            background-color: #0887ad;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }

        nav a:hover {
            color: #0f0f0f;
        }

        .container {
            width: calc(100% - 36px);
            max-width: 850px;
            margin: 25px auto;
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.43);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 25px 70px rgba(59, 80, 150, 0.16);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .logo {
            width: 66px;
            height: 66px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            color: white;
            font-size: 30px;
            border-radius: 20px;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25);
        }

        h1 {
            font-size: clamp(25px, 4vw, 34px);
            letter-spacing: -1px;
            color: #172554;
        }

        .subtitle {
            margin-top: 8px;
            color: #64748b;
            line-height: 1.6;
        }

        .panel {
            padding: 27px;
            margin-top: 22px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.48);
            box-shadow: 0 8px 25px rgba(51, 65, 130, 0.05);
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 23px;
        }

        h2 {
            font-size: 21px;
            color: #1e293b;
        }

        .count {
            padding: 8px 13px;
            border-radius: 30px;
            background: rgba(59, 130, 246, 0.12);
            color: #2563eb;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .student-list {
            display: grid;
            gap: 12px;
        }

        .student {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.62);
            transition: transform 0.2s, background 0.2s;
        }

        .student:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.88);
        }

        .avatar {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 15px;
            color: white;
            background: linear-gradient(135deg, #60a5fa, #4f46e5);
            font-size: 19px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .student:nth-child(even) .avatar {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }

        .student-info {
            flex: 1;
            min-width: 0;
        }

        .student-name {
            color: #1e293b;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .student-details {
            margin-top: 6px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .course-badge {
            max-width: 145px;
            padding: 8px 11px;
            border-radius: 9px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .student:nth-child(even) .course-badge {
            background: #ede9fe;
            color: #6d28d9;
        }

        .empty-state {
            padding: 26px 14px;
            color: #64748b;
            text-align: center;
            font-size: 14px;
            line-height: 1.8;
        }

        .footer {
            padding-top: 25px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: auto;
                margin: 18px 12px;
                padding: 19px;
                border-radius: 20px;
            }

            .header {
                align-items: flex-start;
                gap: 13px;
            }

            .logo {
                width: 52px;
                height: 52px;
                border-radius: 15px;
                font-size: 24px;
            }

            .panel {
                padding: 18px;
            }

            h2 {
                font-size: 18px;
            }

            .student {
                flex-wrap: wrap;
                gap: 11px;
            }

            .student-info {
                flex-basis: calc(100% - 65px);
            }

            .course-badge {
                margin-left: 57px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="/home">Home</a>
            <a href="/enrollment">Enrollments</a>
        </nav>
    </header>

    <main class="container">
        <header class="header">
            <div class="logo" aria-hidden="true">🎓</div>
            <div>
                <h1>Enrolled Students</h1>
                <p class="subtitle">
                    View all students and their selected courses.
                </p>
            </div>
        </header>

        <section class="panel">
            <div class="section-title">
                <h2>👥 Student List</h2>
                <span class="count" id="studentCount">Loading...</span>
            </div>

            <div id="enrollmentList" class="student-list" aria-live="polite">
                <div class="empty-state">Loading enrollments...</div>
            </div>
        </section>

        <footer class="footer">
            Student Enrollment System · Powered by FastAPI
        </footer>
    </main>

    <script>
        async function loadEnrollments() {
            const enrollmentList =
                document.getElementById("enrollmentList");
            const studentCount =
                document.getElementById("studentCount");

            try {
                const response = await fetch("/enrollments");

                if (!response.ok) {
                    throw new Error("Could not load enrollments.");
                }

                const enrollments = await response.json();

                if (!Array.isArray(enrollments)) {
                    throw new Error("Unexpected enrollment data received.");
                }

                studentCount.textContent =
                    enrollments.length +
                    (enrollments.length === 1 ? " Student" : " Students");

                enrollmentList.replaceChildren();

                if (enrollments.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-state";
                    empty.textContent =
                        "🎓 No students enrolled yet. Add your first student from the Home page.";
                    enrollmentList.appendChild(empty);
                    return;
                }

                enrollments.forEach(item => {
                    const card = document.createElement("article");
                    card.className = "student";

                    const avatar = document.createElement("div");
                    avatar.className = "avatar";
                    avatar.setAttribute("aria-hidden", "true");
                    avatar.textContent =
                        (item.student_name || "?").trim().charAt(0) || "?";

                    const info = document.createElement("div");
                    info.className = "student-info";

                    const name = document.createElement("div");
                    name.className = "student-name";
                    name.textContent =
                        item.student_name || "Unknown student";

                    const details = document.createElement("div");
                    details.className = "student-details";
                    details.textContent =
                        "Enrollment ID: " +
                        (item.id ?? item.enrollment_id ?? "N/A") +
                        " | Course ID: " + (item.course_id ?? "N/A");

                    const badge = document.createElement("span");
                    badge.className = "course-badge";

                    const courseNames = {
                        103: "Python Course",
                        104: "Java Course"
                    };

                    badge.textContent =
                        item.course_name ||
                        courseNames[item.course_id] ||
                        ("Course " + (item.course_id ?? "Unknown"));

                    info.append(name, details);
                    card.append(avatar, info, badge);
                    enrollmentList.appendChild(card);
                });

            } catch (error) {
                studentCount.textContent = "Unavailable";
                enrollmentList.replaceChildren();

                const errorText = document.createElement("div");
                errorText.className = "empty-state";
                errorText.textContent =
                    error.message +
                    " Check your GET /enrollments endpoint.";

                enrollmentList.appendChild(errorText);
            }
        }

        loadEnrollments();
    </script>
</body>
</html>
